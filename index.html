<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07162d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Trilingual" />
  <title>Trilingual</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css?v=20260911-sync5" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">MY LANGUAGE NOTES</p>
        <h1>Trilingual</h1>
      </div>
      <button class="icon-button" id="themeBtn" aria-label="테마 전환">☾</button>
    </header>

    <section class="language-switch" aria-label="언어 선택">
      <button class="lang-btn active" data-lang="english">English</button>
      <button class="lang-btn" data-lang="chinese">中文</button>
    </section>

    <nav class="section-tabs" aria-label="학습 메뉴">
      <button class="section-tab active" data-section="today">날짜별 학습</button>
      <button class="section-tab" data-section="notes">교정 표</button>
      <button class="section-tab" data-section="review">복습</button>
    </nav>

    <div class="date-controls"><label for="studyDate">학습 날짜</label><select id="studyDate"></select><button id="refreshBtn" class="icon-button" aria-label="최신 저장 내용 불러오기">↻</button></div>
    <section id="today" class="panel active-panel">
      <div class="section-heading">
        <div>
          <span class="section-kicker">TODAY</span>
          <h2 id="todayTitle">날짜별 학습</h2>
        </div>
        <time id="todayDate">2026.09.10</time>
      </div>
      <div class="session-switch" aria-label="학습 구분"><button data-session="morning">오전 어휘</button><button data-session="evening" class="active">저녁 학습</button></div><div id="lessonCards" class="card-stack"></div>
      <article class="memo-card">
        <div class="card-label"><span>✎</span> 추가 메모</div>
        <p id="memoText"></p>
      </article>
    </section>

    <section id="notes" class="panel">
      <div class="section-heading"><div><span class="section-kicker">NOTES</span><h2>발화·교정 전체 표</h2></div></div>
      <div id="notesList" class="notes-list"></div>
    </section>

    <section id="review" class="panel">
      <div class="section-heading"><div><span class="section-kicker">REVIEW</span><h2>복습 큐</h2></div></div>
      <div id="reviewList" class="review-list"></div>
    </section>

    <button id="installBtn" class="install-button" hidden>홈 화면에 앱으로 설치</button>
    <details class="connection-settings"><summary>시트 연결 설정</summary>
      <p>한 번 연결하면 화면을 보는 동안 20초마다 수정 내용을 확인합니다.</p>
      <a href="connect.html">처음 연결하기 · 설정 안내</a>
      <form id="sheetConnection">
        <label for="sheetEndpoint">Google 웹 앱 주소</label><input id="sheetEndpoint" type="url" placeholder="https://script.google.com/macros/s/…/exec" required autocomplete="off">
        <label for="sheetKey">개인 연결 키</label><input id="sheetKey" type="password" autocomplete="off" placeholder="처음 연결할 때 입력">
        <button type="submit">저장하고 연결</button><button type="button" id="disconnectSheet">연결 해제</button>
      </form><p id="connectionMessage" role="status"></p>
    </details>
    <footer>
      <span>Small practice, every day.</span>
      <span id="syncStatus">저장된 학습 기록</span>
    </footer>
  </main>
  <script src="data.js?v=20260911-sync5"></script>
  <script src="app.js?v=20260911-sync5"></script>
  <script src="sync.js?v=20260911-sync5"></script>
</body>
</html>
