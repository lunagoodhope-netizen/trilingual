<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07162d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Trilingual" />
  <title>Trilingual</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">MY LANGUAGE NOTES</p>
        <h1>Trilingual</h1>
      </div>
      <button class="icon-button" id="themeBtn" aria-label="테마 전환">☾</button>
    </header>

    <section class="language-switch" aria-label="언어 선택">
      <button class="lang-btn active" data-lang="english">English</button>
      <button class="lang-btn" data-lang="chinese">中文</button>
    </section>

    <nav class="section-tabs" aria-label="학습 메뉴">
      <button class="section-tab active" data-section="today">오늘의 학습</button>
      <button class="section-tab" data-section="notes">노트</button>
      <button class="section-tab" data-section="review">복습</button>
    </nav>

    <section id="today" class="panel active-panel">
      <div class="section-heading">
        <div>
          <span class="section-kicker">TODAY</span>
          <h2 id="todayTitle">오늘의 학습</h2>
        </div>
        <time id="todayDate">2026.09.10</time>
      </div>
      <div id="lessonCards" class="card-stack"></div>
      <article class="memo-card">
        <div class="card-label"><span>✎</span> 추가 메모</div>
        <p id="memoText"></p>
      </article>
    </section>

    <section id="notes" class="panel">
      <div class="section-heading"><div><span class="section-kicker">NOTES</span><h2>학습 노트</h2></div></div>
      <div id="notesList" class="notes-list"></div>
    </section>

    <section id="review" class="panel">
      <div class="section-heading"><div><span class="section-kicker">REVIEW</span><h2>복습 큐</h2></div></div>
      <div id="reviewList" class="review-list"></div>
    </section>

    <button id="installBtn" class="install-button" hidden>홈 화면에 앱으로 설치</button>
    <footer>
      <span>Small practice, every day.</span>
      <span id="syncStatus">ChatGPT 기록 시 Sheet + Dashboard 동시 갱신</span>
    </footer>
  </main>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
